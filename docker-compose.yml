version: '3.8'

services:
  # Backend service
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: portfolio-server
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
    volumes:
      - ./server:/app
      - /app/node_modules
    restart: unless-stopped

  # Frontend service
  portfolio:
    build:
      context: ./portfolio
      dockerfile: Dockerfile
    container_name: portfolio-frontend
    ports:
      - "5173:5173"
    depends_on:
      - server
    environment:
      - VITE_API_URL=http://localhost:3001
    volumes:
      - ./portfolio:/app
      - /app/node_modules
    restart: unless-stopped
